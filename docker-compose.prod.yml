services:
  db:
    environment:
      MARIADB_DATABASE: ${SKYMART_DB_NAME:?set SKYMART_DB_NAME}
      MARIADB_USER: ${SKYMART_DB_USER:?set SKYMART_DB_USER}
      MARIADB_PASSWORD: ${SKYMART_DB_PASSWORD:?set SKYMART_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SKYMART_DB_ROOT_PASSWORD:?set SKYMART_DB_ROOT_PASSWORD}
    restart: unless-stopped

  web:
    environment:
      SKYMART_DB_HOST: db
      SKYMART_DB_NAME: ${SKYMART_DB_NAME:?set SKYMART_DB_NAME}
      SKYMART_DB_USER: ${SKYMART_DB_USER:?set SKYMART_DB_USER}
      SKYMART_DB_PASSWORD: ${SKYMART_DB_PASSWORD:?set SKYMART_DB_PASSWORD}
      SKYMART_TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${SKYMART_PORT:-8080}:80"
    restart: unless-stopped
