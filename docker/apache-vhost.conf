<VirtualHost *:80>
 ServerName localhost
 DocumentRoot /var/www/skymart/public
 <Directory /var/www/skymart/public>
  Options -Indexes
  AllowOverride None
  Require all granted
 </Directory>
 <Directory /var/www/skymart>
  Require all denied
 </Directory>
 <Directory /var/www/skymart/public>
  Require all granted
 </Directory>
 ErrorLog ${APACHE_LOG_DIR}/error.log
 CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
