<VirtualHost *:80>
 ServerName localhost
 DocumentRoot /var/www/skymart/public
 <Directory /var/www/skymart>
  Require all denied
 </Directory>
 <Directory /var/www/skymart/public>
  Options -Indexes
  AllowOverride None
  Require all granted
  RewriteEngine On
  RewriteRule ^api/v1(/.*)?$ api/v1/index.php$1 [L,QSA]
 </Directory>
 ErrorLog ${APACHE_LOG_DIR}/error.log
 CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
