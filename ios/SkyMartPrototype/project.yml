name: SkyMartPrototype
options:
  bundleIdPrefix: uk.co.lollipopdesign
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SkyMartPrototype:
    type: application
    platform: iOS
    sources:
      - path: SkyMartPrototype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.lollipopdesign.SkyMartPrototype
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkyMart
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
  SkyMartPrototypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkyMartPrototypeTests
    dependencies:
      - target: SkyMartPrototype
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
