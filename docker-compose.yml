services:
  db:
    container_name: skymart-db
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: skymart
      MARIADB_USER: skymart
      MARIADB_PASSWORD: skymart-dev-only
      MARIADB_ROOT_PASSWORD: skymart-root-dev-only
    volumes:
      - skymart-db:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    container_name: skymart-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKYMART_BUILD_SHA: ${SKYMART_BUILD_SHA:-unknown}
        SKYMART_BUILD_SOURCE: https://github.com/rhine59/skymart
    environment:
      SKYMART_DB_HOST: db
      SKYMART_DB_NAME: skymart
      SKYMART_DB_USER: skymart
      SKYMART_DB_PASSWORD: skymart-dev-only
      SKYMART_UPLOAD_ROOT: /var/lib/skymart/uploads
    volumes:
      - skymart-uploads:/var/lib/skymart/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health.php"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  skymart-db:
  skymart-uploads:
